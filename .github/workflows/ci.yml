name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # aws-lc-sys (rustls' crypto) only builds with clang-cl on Windows ARM64
      - name: Use clang-cl
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
          }
          "CC=clang-cl" | Out-File -Append -FilePath $env:GITHUB_ENV
          "CXX=clang-cl" | Out-File -Append -FilePath $env:GITHUB_ENV
      - run: cargo test
