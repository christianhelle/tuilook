[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/christianhelle/tuilook"

[workspace.dependencies]
tuilook-model = { path = "crates/tuilook-model" }
tuilook-auth = { path = "crates/tuilook-auth" }
tuilook-graph = { path = "crates/tuilook-graph" }
tuilook-store = { path = "crates/tuilook-store" }
tuilook-core = { path = "crates/tuilook-core" }
jiff = "0.2.38"
thiserror = "2.0.21"
rusqlite_migration = "2.6.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
ratatui = "0.30.2"
insta = "1.49.0"
