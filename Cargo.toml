[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/christianhelle/tuilook"

[workspace.dependencies]
tuilook-model = { path = "crates/tuilook-model" }
tuilook-auth = { path = "crates/tuilook-auth" }
tuilook-graph = { path = "crates/tuilook-graph" }
tuilook-store = { path = "crates/tuilook-store" }
tuilook-core = { path = "crates/tuilook-core" }
jiff = { version = "0.2.38", features = ["serde"] }
thiserror = "2.0.21"
rusqlite_migration = "2.6.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync"] }
ratatui = "0.30.2"
insta = "1.49.0"
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
wiremock = "0.6.5"
serde_json = "1.0.154"
keyring = "4.2.0"
fastrand = "2.5.0"
futures = "0.3"
html2text = "0.17.4"
tempfile = "3"
