[package]
name = "tuilook"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "A terminal mail client for Outlook.com and Microsoft 365, with vim-style keys"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/christianhelle/tuilook"
repository = "https://github.com/christianhelle/tuilook"
keywords = ["email", "outlook", "tui", "terminal", "mail"]
categories = ["command-line-utilities", "email"]
exclude = [".github/", ".gitattributes"]

[[bin]]
name = "otlk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
fastrand = "2.5.0"
html2text = { version = "0.17.4", features = ["css"] }
jiff = { version = "0.2.38", features = ["serde"] }
keyring = "4.2.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
futures = "0.3"
insta = "1.49.0"
tempfile = "3"
wiremock = "0.6.5"

# Target-specific build dependencies follow the host, which is Windows for
# every Windows build this project makes.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
